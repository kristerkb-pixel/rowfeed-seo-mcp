# Publishes server.json to the official MCP registry whenever it changes on main.
# GitHub OIDC proves the io.github.kristerkb-pixel namespace, so no manual login or token is needed.
name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths: [server.json, .github/workflows/publish-mcp.yml]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
